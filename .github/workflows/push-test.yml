name: "push test"

on: push

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The last image that has Python 3.8 and 3.9
        os: [ubuntu-24.04]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        check-latest: true
    - name: Install the libraries of the examples
      run: |
        python -m pip install django
    - name: Run tests
      run: |
        python tests/runtests.py
      continue-on-error: false
